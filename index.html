---
layout: default
title: Blog
---

<h1>{{ site.title }}</h1>
<p>{{ site.description }}</p>

{% if site.posts.size > 0 %}
	{% for post in site.posts %}
		<article>
			<h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
			<p><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%B %-d, %Y" }}</time></p>
			{{ post.excerpt }}
		</article>
	{% endfor %}
{% else %}
	<p>No posts yet.</p>
{% endif %}
